<svg xmlns="http://www.w3.org/2000/svg" width="130mm" height="80mm" viewBox="0 0 130 80">
  <!-- MakeIT CSS support test (#38). Every square is drawn black; red means MakeIT applied the CSS for that case.
       In a browser all seven numbered squares are red. Universal selector (*) is in makeit-css-universal.svg (it would hit everything here). -->
  <style>
    .a { stroke: #ff0000 }
    polygon { stroke: #ff0000 }
    g.s4 rect { stroke: #ff0000 }
    g.s5 > rect { stroke: #ff0000 }
    :where(.s6) rect { stroke: #ff0000 }
    g.s8 rect { stroke: #000000 }
  </style>
  <g font-family="sans-serif" font-size="6" fill="#000000" stroke="none">
    <text x="5" y="7">1 class</text><text x="35" y="7">2 type</text><text x="65" y="7">4 descendant</text><text x="95" y="7">5 child</text>
    <text x="5" y="47">6 :where()</text><text x="35" y="47">7 style attr</text><text x="65" y="47">8 inline wins</text><text x="95" y="47">ref black</text>
  </g>
  <g fill="none" stroke-width="0.5">
    <rect class="a" x="5" y="10" width="25" height="25" stroke="#000000"/>
    <polygon points="35,10 60,10 60,35 35,35" stroke="#000000"/>
    <g class="s4"><g><rect x="65" y="10" width="25" height="25" stroke="#000000"/></g></g>
    <g class="s5"><rect x="95" y="10" width="25" height="25" stroke="#000000"/></g>
    <g class="s6"><rect x="5" y="50" width="25" height="25" stroke="#000000"/></g>
    <rect x="35" y="50" width="25" height="25" stroke="#000000" style="stroke:#ff0000"/>
    <g class="s8"><rect x="65" y="50" width="25" height="25" stroke="#000000" style="stroke:#ff0000"/></g>
    <rect x="95" y="50" width="25" height="25" stroke="#000000"/>
  </g>
</svg>
