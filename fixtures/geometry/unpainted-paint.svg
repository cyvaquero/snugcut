<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="40mm" viewBox="0 0 100 40">
  <!-- Paint that shows nothing (#515): the circle's fill (fill-opacity 0) and each square's stroke (stroke-width 0,
       stroke-opacity 0) must export as none, not as paint: the circle as an unfilled outline, the squares as fills only. -->
  <circle cx="15" cy="20" r="10" fill="#000" fill-opacity="0" stroke="#f00"/>
  <rect x="35" y="10" width="20" height="20" fill="#000" stroke="#f00" stroke-width="0"/>
  <rect x="65" y="10" width="20" height="20" fill="#000" stroke="#f00" stroke-opacity="0"/>
</svg>
