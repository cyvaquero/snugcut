# The fixture regression (RELEASING.md) on every pull request and every push to main or develop: snugcut.html is opened
# in headless Chrome, so a script error fails the check, and its exports are compared byte for byte with the base
# branch's (the previous commit on a push), along with the QA workbook tests' expected results. The two libraries come
# from the CDN URLs the app uses, and the search worker runs, as for a visitor (no local copies); they must match the
# integrity hashes in app/index.html, checked first for a clear message. The pages are then loaded over HTTP, snugcut.html
# with its Content-Security-Policy and app/index.html as modules, and fail on a console error or a worker that does not
# start. A change meant to alter exports says so in its pull request body with
# a line starting "Export changes:" (CLAUDE.md); the differences are then listed but don't fail the check. Editing the
# pull request runs the check again with the new body (re-running a finished job reuses the old one). On a push they
# never do, since the pull request already vetted them. A newer run for the same pull request cancels the one still
# running (an edit after a push, or two pushes in a row); pushes to main and develop are never cancelled. Python 3
# standard library only.
name: Fixture regression

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0     # the base branch's snugcut.html comes from git
          persist-credentials: false
      - name: Check the libraries against the integrity hashes in app/index.html
        run: |
          python3 - <<'PY'
          import base64, hashlib, re, urllib.request
          html = open("app/index.html", encoding="utf-8").read()
          tags = re.findall(r'<script\b[^>]*\ssrc="(https://[^"]+)"[^>]*\sintegrity="sha384-([^"]+)"', html)
          assert len(tags) == 2, f"expected 2 library scripts with sha384 integrity, found {len(tags)}"
          for url, want in tags:
              data = urllib.request.urlopen(url, timeout=60).read()
              got = base64.b64encode(hashlib.sha384(data).digest()).decode()
              assert got == want, f"{url}: sha384-{got} does not match the page's sha384-{want}"
              print("ok", url)
          PY
      - name: Exports match the base, and the page and the QA workbook tests run
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          EVENT: ${{ github.event_name }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          opts="--no-sandbox"
          if [ "$EVENT" = push ] || printf '%s\n' "$PR_BODY" | grep -q '^Export changes:'; then opts="$opts --allow-diff"; fi
          python3 tools/regression.py "$BASE" snugcut.html $opts
